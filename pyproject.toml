[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metriclabeling"
version = "0.1.0"
description = "Replication of 'Metric Labeling and Semi-metric Embedding for Protein Annotation Prediction' (Sefer & Kingsford)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emre Sefer" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "networkx>=2.8",
    "pandas>=1.4",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "numba>=0.56",
    "PyMaxflow>=1.2.13",
]

[project.optional-dependencies]
cvxpy = ["cvxpy>=1.3"]
gurobi = ["gurobipy>=10"]
cplex = ["cplex>=22.1"]
dev = ["pytest>=7", "cvxpy>=1.3"]

[project.scripts]
mlabel = "metriclabeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
